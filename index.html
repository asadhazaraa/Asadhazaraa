<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Verification Services</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Roboto,Arial,sans-serif;
  background:#eeeeee;
}


/* =========================
   HEADER
========================= */

.header{
  width:100%;
  height:139px;
  padding:22px;
  background:#98a5c2;
}

.submit{
  width:88px;
  height:38px;

  background:#dc3232;
  color:#fff;

  border:2px solid #e8e8ee;
  border-radius:8px;

  font-size:16px;

  box-shadow:0 2px 6px rgba(0,0,0,.25);

  cursor:pointer;
}


/* =========================
   STRIP
========================= */

.strip{
  width:100%;
  height:22px;
  background:#f1f4f8;
}


/* =========================
   CARDS CONTAINER
========================= */

.cards{
  width:100%;

  padding:11px;

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:22px;

  background:#eeeeee;
}


/* =========================
   COMMON CARD
========================= */

.card{
  width:378px;
  max-width:100%;

  background:#fff;

  border-radius:22px;

  text-align:center;

  text-decoration:none;

  color:inherit;

  box-shadow:
    0 2px 10px rgba(80,110,140,.35);

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  opacity:0;
  transform:translateY(35px);

  transition:
    opacity .7s ease,
    transform .7s ease;
}


/* =========================
   EXACT CARD HEIGHTS
========================= */

/* Driving */
.card:nth-child(1){
  height:184px;
}

/* Arms */
.card:nth-child(2){
  height:187px;
}

/* Dastak */
.card:nth-child(3){
  height:176px;
}


/* =========================
   FADE-UP
========================= */

.card.show{
  opacity:1;
  transform:translateY(0);
}

.card:nth-child(2){
  transition-delay:.12s;
}

.card:nth-child(3){
  transition-delay:.24s;
}


/* =========================
   LOGOS
========================= */

.logo{
  display:block;

  object-fit:contain;

  margin:0 auto 8px;
}


/* Traffic Police */
.card:nth-child(1) .logo{
  width:88px;
  height:88px;
}


/* KPK Police */
.card:nth-child(2) .logo{
  width:82px;
  height:82px;
}


/* Dastak */
.card:nth-child(3) .logo{
  width:80px;
  height:80px;
}


/* =========================
   CARD TEXT
========================= */

.card h3{
  color:#a80f14;

  font-size:18px;
  font-weight:700;

  line-height:1.3;
}

.card p{
  color:#777;

  font-size:15px;

  margin-top:8px;
}


/* =========================
   ABOUT BAR
========================= */

.about{
  width:100%;
  height:65px;

  padding:0 23px;

  display:flex;
  align-items:center;

  background:#1287c4;
}

.about h2{
  color:#a80f14;

  font-size:30px;

  font-family:Georgia,serif;

  font-weight:800;
}


/* =========================
   SCROLL-UP BUTTON
========================= */

.top{
  position:fixed;

  right:30px;
  bottom:30px;

  width:35px;
  height:35px;

  border:0;

  background:#00008b;

  color:#fff;

  font-size:20px;

  cursor:pointer;

  z-index:100;
}


/* =========================
   SMALL MOBILE
========================= */

@media(max-width:399px){

  .cards{
    padding-left:11px;
    padding-right:11px;
  }

  .card{
    width:100%;
  }

}


/* =========================
   TABLET / DESKTOP
========================= */

@media(min-width:700px){

  .cards{
    padding:25px;

    flex-direction:row;

    justify-content:center;
    align-items:center;

    gap:22px;
  }

  .card{
    width:31%;
    max-width:378px;
  }

}


/* =========================
   ACCESSIBILITY
========================= */

@media(prefers-reduced-motion:reduce){

  .card{
    opacity:1;
    transform:none;
    transition:none;
  }

}

</style>

</head>

<body>


<!-- =========================
     HEADER
========================= -->

<div class="header">

  <button
    class="submit"
    type="button"
  >
    Submit
  </button>

</div>


<!-- =========================
     STRIP
========================= -->

<div class="strip"></div>


<!-- =========================
     VERIFICATION CARDS
========================= -->

<div class="cards">


  <!-- CARD 1 -->

  <a
    class="card"
    href="#"
  >

    <img
      class="logo"
      src="traffic-police.png"
      alt="Traffic Police"
    >

    <h3>
      Driving License Verification
    </h3>

    <p>
      Directorate of Transport
    </p>

  </a>


  <!-- CARD 2 -->

  <a
    class="card"
    href="#"
  >

    <img
      class="logo"
      src="kpk-police.png"
      alt="KPK Police"
    >

    <h3>
      Arms License Verification
    </h3>

    <p>
      Home Department
    </p>

  </a>


  <!-- CARD 3 -->

  <a
    class="card"
    href="#"
  >

    <img
      class="logo"
      src="dastak.png"
      alt="Dastak"
    >

    <h3>
      Dastak Digital Arms License
    </h3>

    <p>
      Home Department
    </p>

  </a>


</div>


<!-- =========================
     ABOUT US
========================= -->

<div class="about">

  <h2>
    About Us
  </h2>

</div>


<!-- =========================
     SCROLL UP
========================= -->

<button
  class="top"
  type="button"
  onclick="window.scrollTo({
    top:0,
    behavior:'smooth'
  })"
>
  &#8963;
</button>


<script>

/* =========================
   FADE-UP / SCROLL REVEAL
========================= */

const cards =
  document.querySelectorAll(".card");


const observer =
  new IntersectionObserver(

    function(entries){

      entries.forEach(function(entry){

        if(entry.isIntersecting){

          entry.target
            .classList
            .add("show");

          observer
            .unobserve(entry.target);

        }

      });

    },

    {
      threshold:0.12
    }

  );


cards.forEach(function(card){

  observer.observe(card);

});

</script>


</body>
</html>
